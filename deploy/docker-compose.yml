# tenfold.kz on a VPS: the Next.js app behind Caddy (automatic HTTPS via Let's Encrypt).
services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SITE_URL: https://tenfold.kz
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
